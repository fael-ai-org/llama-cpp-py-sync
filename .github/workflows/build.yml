name: Build Wheels
run-name: ${{ inputs.signing_session != '' && format('Finalize signed {0}', inputs.signing_session) || github.workflow }}

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      signed_release_id:
        description: 'Draft release ID for final signed-byte attestation only'
        required: false
        default: ''
        type: string
      signing_session:
        description: 'Locally authorized signing session ID'
        required: false
        default: ''
        type: string
      signing_manifest_sha256:
        description: 'SHA-256 of the locally signed release manifest'
        required: false
        default: ''
        type: string
      force_rebuild:
        description: 'Force rebuild even if no upstream changes'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      build_target:
        description: 'Build all wheels or one specific target'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux-x86_64-cpu
          - linux-x86_64-cuda
          - linux-x86_64-vulkan
          - macos-arm64-metal
          - macos-arm64-vulkan
          - macos-x86_64-cpu
          - macos-x86_64-vulkan
          - windows-x64-cpu
          - windows-x64-cuda
          - windows-x64-vulkan
      release_tag:
        description: 'Existing or new release tag to receive rebuilt wheels (for example b10380)'
        required: false
        default: ''
        type: string

env:
  LLAMA_CPP_REPO: https://github.com/ggml-org/llama.cpp.git

jobs:
  check-upstream:
    if: github.event.inputs.signed_release_id == ''
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      upstream_tag_exists: ${{ steps.check.outputs.upstream_tag_exists }}
      latest_upstream_tag: ${{ steps.check.outputs.latest_upstream_tag }}
      latest_upstream_tag_sha: ${{ steps.check.outputs.latest_upstream_tag_sha }}
      build_target: ${{ steps.check.outputs.build_target }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      publish_release: ${{ steps.check.outputs.publish_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      
      - name: Check upstream for changes
        id: check
        run: |
          EVENT_NAME="${{ github.event_name }}"
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          BUILD_TARGET="${{ github.event.inputs.build_target || 'all' }}"
          RELEASE_TAG_INPUT="${{ github.event.inputs.release_tag || '' }}"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && \
             [ "${BUILD_TARGET}" != "all" ] && [ -z "${RELEASE_TAG_INPUT}" ]; then
            echo "release_tag is required when building a specific target" >&2
            exit 1
          fi

          RELEASE_TAG=""
          if [ "${REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${REF_NAME}"
          elif [ -n "${RELEASE_TAG_INPUT}" ]; then
            RELEASE_TAG="${RELEASE_TAG_INPUT}"
          fi

          echo "build_target=${BUILD_TARGET}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          if [ -n "${RELEASE_TAG}" ]; then
            echo "publish_release=true" >> $GITHUB_OUTPUT
          else
            echo "publish_release=false" >> $GITHUB_OUTPUT
          fi

          # If this workflow is running for a tag, prefer building against the upstream tag SHA *if it exists upstream*.
          # Otherwise, build against upstream HEAD.
          UPSTREAM_TAG=""
          UPSTREAM_TAG_EXISTS="false"

          if [ -n "${RELEASE_TAG}" ]; then
            UPSTREAM_TAG="${RELEASE_TAG}"
            UPSTREAM_SHA=$(git ls-remote --tags --refs ${{ env.LLAMA_CPP_REPO }} "refs/tags/${UPSTREAM_TAG}" | cut -f1)
            if [ -n "${UPSTREAM_SHA}" ]; then
              UPSTREAM_TAG_EXISTS="true"
            else
              # Allow numeric hotfix tags such as b10330.1 to publish a
              # corrected build against the matching upstream base tag.
              BASE_TAG="${UPSTREAM_TAG%%.*}"
              if [ "${BASE_TAG}" != "${UPSTREAM_TAG}" ]; then
                BASE_SHA=$(git ls-remote --tags --refs ${{ env.LLAMA_CPP_REPO }} "refs/tags/${BASE_TAG}" | cut -f1)
                if [ -n "${BASE_SHA}" ]; then
                  UPSTREAM_TAG="${BASE_TAG}"
                  UPSTREAM_SHA="${BASE_SHA}"
                  UPSTREAM_TAG_EXISTS="true"
                else
                  # Local-only tag without a matching upstream base.
                  UPSTREAM_SHA=$(git ls-remote ${{ env.LLAMA_CPP_REPO }} HEAD | cut -f1)
                fi
              else
                # Local-only tag; don't create a release for it.
                UPSTREAM_SHA=$(git ls-remote ${{ env.LLAMA_CPP_REPO }} HEAD | cut -f1)
              fi
            fi
          else
            UPSTREAM_SHA=$(git ls-remote ${{ env.LLAMA_CPP_REPO }} HEAD | cut -f1)
          fi

          echo "upstream_tag=${UPSTREAM_TAG}" >> $GITHUB_OUTPUT
          echo "upstream_tag_exists=${UPSTREAM_TAG_EXISTS}" >> $GITHUB_OUTPUT

          echo "upstream_sha=${UPSTREAM_SHA}" >> $GITHUB_OUTPUT

          # Discover latest upstream tag (for scheduled mirroring).
          # Uses version-sort; works well for semver tags (v1.2.3) and most tag naming schemes.
          LATEST_UPSTREAM_TAG=$(git ls-remote --tags --refs ${{ env.LLAMA_CPP_REPO }} 'refs/tags/*' |
            awk -F/ '{print $NF}' |
            sort -V |
            tail -n 1)

          if [ -n "${LATEST_UPSTREAM_TAG}" ]; then
            LATEST_UPSTREAM_TAG_SHA=$(git ls-remote --tags --refs ${{ env.LLAMA_CPP_REPO }} "refs/tags/${LATEST_UPSTREAM_TAG}" | cut -f1)
          else
            LATEST_UPSTREAM_TAG_SHA=""
          fi

          echo "latest_upstream_tag=${LATEST_UPSTREAM_TAG}" >> $GITHUB_OUTPUT
          echo "latest_upstream_tag_sha=${LATEST_UPSTREAM_TAG_SHA}" >> $GITHUB_OUTPUT
          
          if [ -f .llama_cpp_sync_state.json ]; then
            LAST_SHA=$(cat .llama_cpp_sync_state.json | jq -r '.last_sync_sha // ""')
          else
            LAST_SHA=""
          fi
          
          # Build only for tag pushes, or manual workflow_dispatch when force_rebuild=true.
          if [ "${{ github.event.inputs.force_rebuild }}" == "true" ] || \
             [ "${BUILD_TARGET}" != "all" ] || [ -n "${RELEASE_TAG_INPUT}" ] || \
             [ "${REF_TYPE}" = "tag" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  validate-bindings:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Resolve pinned llama.cpp SHA
        id: pinned
        env:
          UPSTREAM_SHA: ${{ needs.check-upstream.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${UPSTREAM_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the requested build source" >&2
            exit 1
          fi
          echo "sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve bindings timestamp
        id: bind_ts
        run: |
          python - <<'PY'
          import os, pathlib, re, sys

          bindings = pathlib.Path('src/llama_cpp_py_sync/_cffi_bindings.py')
          ts = ''
          if bindings.exists():
              m = re.search(r"Generated:\s*(.+)", bindings.read_text(encoding='utf-8'))
              if m:
                  ts = m.group(1).strip()

          if not ts:
              print('Could not resolve bindings timestamp', file=sys.stderr)
              sys.exit(1)

          print(f"timestamp={ts}")
          print(f"timestamp={ts}", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cffi numpy

      - name: Clone llama.cpp (headers only)
        run: |
          set -euo pipefail
          git clone ${{ env.LLAMA_CPP_REPO }} vendor/llama.cpp
          git -C vendor/llama.cpp fetch --depth 1 origin "${{ steps.pinned.outputs.sha }}"
          git -C vendor/llama.cpp checkout --detach "${{ steps.pinned.outputs.sha }}"

      - name: Regenerate bindings from vendored llama.cpp
        run: |
          python scripts/gen_bindings.py --commit-sha "$(git -C vendor/llama.cpp rev-parse HEAD)" --timestamp "${{ steps.bind_ts.outputs.timestamp }}"

      - name: Validate header, structs/enums, and signatures
        run: |
          python scripts/validate_cffi_surface.py --check-structs --check-enums --check-signatures

      - name: Validate high-level Python vs CFFI cdef
        run: |
          python scripts/validate_high_level_api.py

      - name: Ensure committed bindings are up-to-date
        run: |
          git diff --exit-code -- src/llama_cpp_py_sync/_cffi_bindings.py

  build-linux-x86_64:
    needs: [check-upstream, validate-bindings]
    if: needs.check-upstream.outputs.should_build == 'true' && (needs.check-upstream.outputs.build_target == 'all' || needs.check-upstream.outputs.build_target == 'linux-x86_64-cpu')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel cffi numpy
      
      - name: Clone llama.cpp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LLAMA_SHA = '${{ needs.check-upstream.outputs.upstream_sha }}'
          git clone ${{ env.LLAMA_CPP_REPO }} vendor/llama.cpp
          git -C vendor/llama.cpp fetch --depth 1 origin $env:LLAMA_SHA
          git -C vendor/llama.cpp checkout --detach $env:LLAMA_SHA
      
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential patchelf

      - name: Regenerate bindings from vendored llama.cpp
        run: |
          python scripts/gen_bindings.py --commit-sha "$(git -C vendor/llama.cpp rev-parse HEAD)"
      
      - name: Build llama.cpp
        run: |
          python scripts/build_llama_cpp.py --no-cuda --no-rocm --no-vulkan

      - name: Validate llama.cpp exports
        run: |
          python scripts/validate_llama_exports.py
      
      - name: Generate version
        run: |
          python scripts/auto_version.py --update
      
      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Retag wheel (linux)
        run: |
          python -m pip install --upgrade wheel
          ORIGINAL_WHEELS=$(ls dist/*.whl)
          for w in $ORIGINAL_WHEELS; do
            python -m wheel tags --platform-tag manylinux2014_x86_64 --build 1cpu "$w"
          done
          rm -f $ORIGINAL_WHEELS

      - name: Smoke test installed wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall dist/*.whl
          python -c "from llama_cpp_py_sync._cffi_bindings import get_lib, get_mtmd_lib; get_lib(); get_mtmd_lib(); print('smoke-ok')"
      
      - name: Attest final wheel
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64-cpu
          path: dist/*

  build-linux-x86_64-cuda:
    needs: [check-upstream, validate-bindings]
    if: needs.check-upstream.outputs.should_build == 'true' && (needs.check-upstream.outputs.build_target == 'all' || needs.check-upstream.outputs.build_target == 'linux-x86_64-cuda')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: '12.8.0'
          method: 'network'

      - name: Install system dependencies
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i/5). Sleeping before retry..."
            sleep 20
          done
          sudo apt-get install -y cmake ninja-build build-essential patchelf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel cffi numpy

      - name: Discover CUDA library directories
        id: cuda_libs
        shell: bash
        run: |
          set -euo pipefail

          cuda_root=""
          for candidate in "${CUDA_PATH:-}" "${CUDA_HOME:-}"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then
              cuda_root="$candidate"
              break
            fi
          done

          if [ -z "$cuda_root" ] && command -v nvcc >/dev/null 2>&1; then
            cuda_root="$(cd "$(dirname "$(command -v nvcc)")/.." && pwd)"
          fi

          if [ -z "$cuda_root" ]; then
            for candidate in /usr/local/cuda /usr/local/cuda-* /opt/cuda /opt/cuda-*; do
              if [ -d "$candidate" ]; then
                cuda_root="$candidate"
                break
              fi
            done
          fi

          if [ -z "$cuda_root" ]; then
            echo "Could not determine CUDA root on the Linux CUDA runner" >&2
            exit 1
          fi

          lib_dirs=()
          for subdir in lib64 targets/x86_64-linux/lib lib; do
            if [ -d "$cuda_root/$subdir" ]; then
              lib_dirs+=("$cuda_root/$subdir")
            fi
          done

          if [ ${#lib_dirs[@]} -eq 0 ]; then
            echo "Could not find CUDA library directories under $cuda_root" >&2
            exit 1
          fi

          cuda_lib_dirs="$(IFS=:; echo "${lib_dirs[*]}")"

          echo "cuda_root=$cuda_root" >> "$GITHUB_OUTPUT"
          echo "cuda_lib_dirs=$cuda_lib_dirs" >> "$GITHUB_OUTPUT"

          if [ -d "$cuda_root/bin" ]; then
            echo "$cuda_root/bin" >> "$GITHUB_PATH"
          fi

          echo "Using CUDA root: $cuda_root"
          echo "Using CUDA library directories: $cuda_lib_dirs"
      
      - name: Clone llama.cpp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LLAMA_SHA = '${{ needs.check-upstream.outputs.upstream_sha }}'
          git clone ${{ env.LLAMA_CPP_REPO }} vendor/llama.cpp
          git -C vendor/llama.cpp fetch --depth 1 origin $env:LLAMA_SHA
          git -C vendor/llama.cpp checkout --detach $env:LLAMA_SHA

      - name: Regenerate bindings from vendored llama.cpp
        run: |
          python scripts/gen_bindings.py --commit-sha "$(git -C vendor/llama.cpp rev-parse HEAD)"
      
      - name: Build llama.cpp with CUDA
        env:
          CUDA_HOME: ${{ steps.cuda_libs.outputs.cuda_root }}
          CUDA_PATH: ${{ steps.cuda_libs.outputs.cuda_root }}
          LLAMA_CPP_CUDA_LIB_DIRS: ${{ steps.cuda_libs.outputs.cuda_lib_dirs }}
          CMAKE_CUDA_ARCHITECTURES: '50;52;60;61;70;75;80;86;89;90;100;120'
        run: |
          python scripts/build_llama_cpp.py --no-rocm --no-vulkan --no-metal --parallel 2

      - name: Validate llama.cpp exports
        run: |
          python scripts/validate_llama_exports.py

      - name: Verify bundled Linux CUDA shared libraries
        shell: bash
        run: |
          set -euo pipefail
          pkg_dir="$GITHUB_WORKSPACE/src/llama_cpp_py_sync"

          echo "Bundled Linux shared libraries:"
          find "$pkg_dir" -maxdepth 1 -type f \( \
            -name 'libllama.so*' -o \
            -name 'libmtmd.so*' -o \
            -name 'libggml*.so*' -o \
            -name 'libcudart.so*' -o \
            -name 'libcublas*.so*' -o \
            -name 'libcusparse.so*' -o \
            -name 'libcusolver.so*' -o \
            -name 'libcurand.so*' -o \
            -name 'libnv*.so*' \
          \) | sort

          ldd_output="$(env -u LD_LIBRARY_PATH ldd "$pkg_dir/libggml-cuda.so.0" || true)"
          printf '%s\n' "$ldd_output"

          unresolved_runtime="$(printf '%s\n' "$ldd_output" | grep '=> not found' | grep -E 'libcudart|libcublas|libcublasLt|libcusparse|libcusolver|libcurand|libnvrtc|libnvJitLink' || true)"
          if [ -n "$unresolved_runtime" ]; then
            echo "Unresolved bundled CUDA runtime libraries remain:" >&2
            printf '%s\n' "$unresolved_runtime" >&2
            exit 1
          fi

          nonlocal_runtime="$(printf '%s\n' "$ldd_output" | grep -E 'libcudart|libcublas|libcublasLt|libcusparse|libcusolver|libcurand|libnvrtc|libnvJitLink' | grep -Fv "$pkg_dir" || true)"
          if [ -n "$nonlocal_runtime" ]; then
            echo "CUDA runtime libraries were not resolved from the package directory:" >&2
            printf '%s\n' "$nonlocal_runtime" >&2
            exit 1
          fi
      
      - name: Generate version
        run: |
          python scripts/auto_version.py --update
      
      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Retag wheel (linux)
        run: |
          python -m pip install --upgrade wheel
          ORIGINAL_WHEELS=$(ls dist/*.whl)
          for w in $ORIGINAL_WHEELS; do
            python -m wheel tags --platform-tag manylinux2014_x86_64 --build 1cu128 "$w"
          done
          rm -f $ORIGINAL_WHEELS

      - name: Enforce GitHub release size limit
        run: |
          python - <<'PY'
          from pathlib import Path

          limit = 2 * 1024 * 1024 * 1024
          for wheel in Path("dist").glob("*.whl"):
              size = wheel.stat().st_size
              print(f"{wheel.name}: {size:,} bytes")
              if size >= limit:
                  raise SystemExit(f"{wheel.name} exceeds GitHub's 2 GiB release-asset limit")
          PY

      - name: Smoke test installed wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall dist/*.whl
          python -c "from llama_cpp_py_sync._cffi_bindings import get_lib, get_mtmd_lib; get_lib(); get_mtmd_lib(); print('smoke-ok')"
      
      - name: Attest final wheel
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64-cuda-cu128
          path: dist/*

  build-linux-x86_64-vulkan:
    needs: [check-upstream, validate-bindings]
    if: needs.check-upstream.outputs.should_build == 'true' && (needs.check-upstream.outputs.build_target == 'all' || needs.check-upstream.outputs.build_target == 'linux-x86_64-vulkan')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel cffi numpy
      
      - name: Clone llama.cpp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LLAMA_SHA = '${{ needs.check-upstream.outputs.upstream_sha }}'
          git clone ${{ env.LLAMA_CPP_REPO }} vendor/llama.cpp
          git -C vendor/llama.cpp fetch --depth 1 origin $env:LLAMA_SHA
          git -C vendor/llama.cpp checkout --detach $env:LLAMA_SHA
      
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential patchelf

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.4.335.0'

      - name: Regenerate bindings from vendored llama.cpp
        run: |
          python scripts/gen_bindings.py --commit-sha "$(git -C vendor/llama.cpp rev-parse HEAD)"
      
      - name: Build llama.cpp with Vulkan
        run: |
          python scripts/build_llama_cpp.py --no-cuda --no-rocm --no-metal

      - name: Validate llama.cpp exports
        run: |
          python scripts/validate_llama_exports.py
      
      - name: Generate version
        run: |
          python scripts/auto_version.py --update
      
      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Retag wheel (linux)
        run: |
          python -m pip install --upgrade wheel
          ORIGINAL_WHEELS=$(ls dist/*.whl)
          for w in $ORIGINAL_WHEELS; do
            python -m wheel tags --platform-tag manylinux2014_x86_64 --build 1vulkan "$w"
          done
          rm -f $ORIGINAL_WHEELS

      - name: Smoke test installed wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall dist/*.whl
          python -c "from llama_cpp_py_sync._cffi_bindings import get_lib, get_mtmd_lib; get_lib(); get_mtmd_lib(); print('smoke-ok')"
          python -c "from llama_cpp_py_sync.backends import get_backend_info; info=get_backend_info(); assert info.vulkan, info; print('vulkan-backend-ok')"
      
      - name: Attest final wheel
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64-vulkan
          path: dist/*

  build-macos-arm64:
    needs: [check-upstream, validate-bindings]
    if: needs.check-upstream.outputs.should_build == 'true' && (needs.check-upstream.outputs.build_target == 'all' || needs.check-upstream.outputs.build_target == 'macos-arm64-metal')
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel cffi numpy
      
      - name: Clone llama.cpp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LLAMA_SHA = '${{ needs.check-upstream.outputs.upstream_sha }}'
          git clone ${{ env.LLAMA_CPP_REPO }} vendor/llama.cpp
          git -C vendor/llama.cpp fetch --depth 1 origin $env:LLAMA_SHA
          git -C vendor/llama.cpp checkout --detach $env:LLAMA_SHA

      - name: Install build tools
        run: |
          brew install cmake ninja

      - name: Regenerate bindings from vendored llama.cpp
        run: |
          python scripts/gen_bindings.py --commit-sha "$(git -C vendor/llama.cpp rev-parse HEAD)"
      
      - name: Build llama.cpp with Metal
        run: |
          python scripts/build_llama_cpp.py --no-cuda --no-rocm --no-vulkan

      - name: Validate llama.cpp exports
        run: |
          python scripts/validate_llama_exports.py

      - name: Ad-hoc sign LLaMA-owned macOS native artifacts (test-only)
        run: bash scripts/sign_macos_ad_hoc.sh src/llama_cpp_py_sync
      
      - name: Generate version
        run: |
          python scripts/auto_version.py --update
      
      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Retag wheel (macos)
        run: |
          python -m pip install --upgrade wheel
          ORIGINAL_WHEELS=$(ls dist/*.whl)
          for w in $ORIGINAL_WHEELS; do
            python -m wheel tags --platform-tag macosx_14_0_arm64 --build 1metal "$w"
          done
          rm -f $ORIGINAL_WHEELS

      - name: Smoke test installed wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall dist/*.whl
