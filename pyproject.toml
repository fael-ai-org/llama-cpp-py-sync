[build-system]
requires = ["setuptools>=77.0", "wheel", "cffi>=1.15.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-cpp-py-sync"
dynamic = ["version"]
description = "Auto-synchronized Python bindings for llama.cpp using CFFI ABI mode"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Faris Al-Zahrani", email = "contact@fariszahrani.com"}
]
maintainers = [
    {name = "Faris Al-Zahrani", email = "contact@fariszahrani.com"}
]
keywords = [
    "llama",
    "llama.cpp",
    "llm",
    "language-model",
    "ai",
    "machine-learning",
    "gguf",
    "inference",
    "cffi",
    "bindings"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "cffi>=1.15.0",
    "certifi>=2023.7.22",
    "numpy>=1.20.0",
    "pyyaml>=5.1",
    "requests>=2.25",
    "tqdm>=4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
convert = [
    "transformers>=4.35.0",
    "torch~=2.6.0; platform_machine != 's390x'",
    "torch>=0.0.0.dev0; platform_machine == 's390x'",
    "sentencepiece>=0.1.98,<0.3.0",
    "safetensors>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/FarisZahrani/llama-cpp-py-sync"
Repository = "https://github.com/FarisZahrani/llama-cpp-py-sync"
Documentation = "https://github.com/FarisZahrani/llama-cpp-py-sync#readme"
Issues = "https://github.com/FarisZahrani/llama-cpp-py-sync/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["llama_cpp_py_sync*", "gguf*"]

[tool.setuptools.dynamic]
version = {attr = "llama_cpp_py_sync._version.__version__"}

[tool.setuptools.package-data]
llama_cpp_py_sync = [
    "*.so",
    "*.so.*",
    "*.dylib",
    "*.dll",
    "*.pyd",
    "THIRD_PARTY_NOTICES.txt",
    "py.typed",
]
gguf = [
    "py.typed",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313", "py314"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["src/gguf"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/llama_cpp_py_sync/_cffi_bindings.py" = ["W291"]
"src/llama_cpp_py_sync/convert_hf_to_gguf.py" = ["ALL"]
"src/llama_cpp_py_sync/convert_llama_ggml_to_gguf.py" = ["ALL"]
"src/llama_cpp_py_sync/convert_lora_to_gguf.py" = ["ALL"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.llama_cpp_py_sync.ci]
build_python = "3.13.13"
test_pythons = ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
