name: Sync Upstream

on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 4:00 AM UTC
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Exact upstream tag to sync (for example b12655 or v1.0.0); leave empty to select the newest numbered upstream build tag'
        required: false
        default: ''
        type: string
      force_sync:
        description: 'Force sync even if no changes'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  LLAMA_CPP_REPO: https://github.com/ggml-org/llama.cpp.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Fetch tags
        run: |
          git fetch --tags --force --prune --prune-tags
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Resolve latest upstream tag
        id: upstream
        env:
          UPSTREAM_TAG_INPUT: ${{ github.event.inputs.upstream_tag || '' }}
        run: |
          set -euo pipefail

          # Fetch upstream tags into a dedicated namespace. The default selector filters
          # this namespace to upstream numbered build tags; manual runs can pin any tag.
          git remote remove upstream >/dev/null 2>&1 || true
          git remote add upstream ${{ env.LLAMA_CPP_REPO }}
          # Disable automatic tag following: only these namespaced upstream refs
          # are candidates for selection.
          git fetch --no-tags --force upstream '+refs/tags/*:refs/tags/_upstream/*'

          if [ -n "${UPSTREAM_TAG_INPUT}" ]; then
            if ! git check-ref-format "refs/tags/${UPSTREAM_TAG_INPUT}"; then
              echo "Invalid upstream tag: ${UPSTREAM_TAG_INPUT}" >&2
              exit 1
            fi
            LATEST_UPSTREAM_TAG_REF="refs/tags/_upstream/${UPSTREAM_TAG_INPUT}"
            if ! git show-ref --verify --quiet "${LATEST_UPSTREAM_TAG_REF}"; then
              echo "Upstream tag not found: ${UPSTREAM_TAG_INPUT}" >&2
              exit 1
            fi
          else
            LATEST_UPSTREAM_TAG=$(git for-each-ref --format='%(refname)' refs/tags/_upstream \
              | python scripts/resolve_upstream_build_tag.py)
            LATEST_UPSTREAM_TAG_REF="refs/tags/_upstream/${LATEST_UPSTREAM_TAG}"
            echo "Selected latest upstream numbered build tag: ${LATEST_UPSTREAM_TAG}"
            if ! git show-ref --verify --quiet "${LATEST_UPSTREAM_TAG_REF}"; then
              echo "Selected upstream build tag is missing from fetched refs: ${LATEST_UPSTREAM_TAG}" >&2
              exit 1
            fi
          fi
          if [ -z "${LATEST_UPSTREAM_TAG_REF}" ]; then
            echo "No upstream tag found; skipping."
            exit 0
          fi

          # Strip prefix: refs/tags/_upstream/<tag> -> <tag>
          LATEST_UPSTREAM_TAG=${LATEST_UPSTREAM_TAG_REF#refs/tags/_upstream/}

          LATEST_UPSTREAM_TAG_SHA=$(git rev-parse "${LATEST_UPSTREAM_TAG_REF}^{commit}")
          echo "upstream_tag=${LATEST_UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${LATEST_UPSTREAM_TAG_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check for upstream changes
        id: check
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          UPSTREAM_SHA="${{ steps.upstream.outputs.upstream_sha }}"
          test -n "${UPSTREAM_SHA}"
          echo "upstream_sha=${UPSTREAM_SHA}" >> $GITHUB_OUTPUT
          
          if [ -f .llama_cpp_sync_state.json ]; then
            LAST_SHA=$(cat .llama_cpp_sync_state.json | jq -r '.last_sync_sha // ""')
          else
            LAST_SHA=""
          fi
          echo "last_sha=${LAST_SHA}" >> $GITHUB_OUTPUT
          
          # Revalidate if a previous run committed bindings but never published
          # its tag, or upstream added a tag on an already-synchronized commit.
          if [ "${{ github.event.inputs.force_sync }}" == "true" ] || [ "${UPSTREAM_SHA}" != "${LAST_SHA}" ] || \
             ! git ls-remote --exit-code --tags origin "refs/tags/${UPSTREAM_TAG}" >/dev/null 2>&1; then
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          else
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Sync upstream
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          python scripts/sync_upstream.py --force --revision "${{ steps.check.outputs.upstream_sha }}"
      
      - name: Regenerate bindings
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          pip install cffi
          python scripts/gen_bindings.py --commit-sha ${{ steps.check.outputs.upstream_sha }}
      
      - name: Update version
        if: steps.check.outputs.needs_sync == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          python scripts/auto_version.py --update --upstream-tag "${UPSTREAM_TAG}"

      - name: Validate regenerated CFFI against llama.cpp headers
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          python scripts/validate_cffi_surface.py --check-structs --check-enums --check-signatures

      - name: Validate high-level Python against regenerated CFFI
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          python scripts/validate_high_level_api.py

      - name: Keep regenerated bindings for a manual wrapper fix
        if: failure() && steps.check.outputs.needs_sync == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-sync-regenerated-bindings
          path: |
            .llama_cpp_sync_state.json
            src/llama_cpp_py_sync/_cffi_bindings.py
            src/llama_cpp_py_sync/_version.py
            src/llama_cpp_py_sync/native_manifest.json
          if-no-files-found: ignore

      - name: Commit changes
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .llama_cpp_sync_state.json
          git add src/llama_cpp_py_sync/_cffi_bindings.py
          git add src/llama_cpp_py_sync/native_manifest.json
          git add src/llama_cpp_py_sync/_version.py
          
          UPSTREAM_SHORT=$(echo "${{ steps.check.outputs.upstream_sha }}" | cut -c1-8)
          if ! git diff --cached --quiet; then
            git commit -m "sync: update to llama.cpp ${UPSTREAM_SHORT}"
          fi
          git push

      - name: Publish validated upstream tag
        if: steps.check.outputs.needs_sync == 'true'
        id: mirror_tag
        env:
          LATEST_UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
          LATEST_UPSTREAM_TAG_SHA: ${{ steps.upstream.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${LATEST_UPSTREAM_TAG}" >/dev/null 2>&1; then
            echo "Tag already exists in this repo: ${LATEST_UPSTREAM_TAG}"
            exit 0
          fi
          # Tag the pushed, validated bindings commit, never the pre-sync source.
          git tag -a "${LATEST_UPSTREAM_TAG}" -m "Mirror llama.cpp tag ${LATEST_UPSTREAM_TAG} (${LATEST_UPSTREAM_TAG_SHA})"
          git push origin "refs/tags/${LATEST_UPSTREAM_TAG}"
          echo "mirrored_tag=${LATEST_UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"

      - name: Trigger Build Wheels for mirrored tag
        if: steps.mirror_tag.outputs.mirrored_tag != ''
        env:
          MIRRORED_TAG: ${{ steps.mirror_tag.outputs.mirrored_tag }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS -L \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
            -d "{\"ref\":\"refs/tags/${MIRRORED_TAG}\"}"
