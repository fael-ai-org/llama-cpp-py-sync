        shell: pwsh
        run: |
          $sha = git -C vendor/llama.cpp rev-parse HEAD
          python scripts/gen_bindings.py --commit-sha $sha
      
      - name: Build llama.cpp with CUDA
        env:
          CMAKE_CUDA_ARCHITECTURES: '50;52;60;61;70;75;80;86;89;90;100;120'
        run: |
          python scripts/build_llama_cpp.py --no-rocm --no-vulkan --no-metal --parallel 2

      - name: Bundle ggml dependency DLLs (windows cuda)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'src\llama_cpp_py_sync'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'vendor\llama.cpp\build'
          if (-not (Test-Path $buildDir)) { throw "llama.cpp build dir not found: $buildDir" }

          $deps = Get-ChildItem -Path $buildDir -Recurse -Filter 'ggml*.dll' -ErrorAction SilentlyContinue
          if (-not $deps) {
            Write-Warning "No ggml*.dll files found under $buildDir. If smoke test still fails with 0x7e, the missing dependency may be elsewhere."
          } else {
            foreach ($d in $deps) {
              Copy-Item -Force $d.FullName $packageDir
              Write-Host "Bundled ggml dep: $($d.FullName) -> $packageDir"
            }
          }

      - name: Bundle Windows runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'src\llama_cpp_py_sync'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $requiredDlls = @(
            # MSVC / OpenMP runtime
            'vcruntime140.dll',
            'vcruntime140_1.dll',
            'msvcp140.dll',
            'concrt140.dll',
            'vcomp140.dll'
          )

          function Copy-DllIfFound([string]$path) {
            if (Test-Path $path) {
              Copy-Item -Force $path $packageDir
              Write-Host "Bundled: $path"
              return $true
            }
            return $false
          }

          $searchDirs = @()

          if ($env:VCToolsRedistDir) {
            $searchDirs += (Join-Path $env:VCToolsRedistDir 'x64\Microsoft.VC143.CRT')
            $searchDirs += (Join-Path $env:VCToolsRedistDir 'x64')
          }

          $pf86 = ${env:ProgramFiles(x86)}
          if (-not $pf86) { $pf86 = 'C:\\Program Files (x86)' }
          $vsRoot = Join-Path $pf86 'Microsoft Visual Studio'
          if (Test-Path $vsRoot) {
            $candidates = Get-ChildItem -Path $vsRoot -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\VC\\Redist\\MSVC\\' -and $_.FullName -match '\\x64(\\Microsoft\.VC\d+\.CRT)?$' }
            foreach ($dir in $candidates) {
              $searchDirs += $dir.FullName
            }
          }

          $searchDirs += (Join-Path $env:WINDIR 'System32')
          $searchDirs += (Join-Path $env:WINDIR 'SysWOW64')

          if ($env:CUDA_PATH -and (Test-Path $env:CUDA_PATH)) {
            $searchDirs += (Join-Path $env:CUDA_PATH 'bin')
            $searchDirs += (Join-Path $env:CUDA_PATH 'lib')
          }
          $searchDirs += 'C:\\Program Files\\NVIDIA Corporation\\NvToolsExt\\bin\\x64'

          $searchDirs = $searchDirs | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          $found = @{}
          foreach ($n in $requiredDlls) { $found[$n] = $false }

          foreach ($n in $requiredDlls) {
            foreach ($dir in $searchDirs) {
              if (-not $found[$n]) {
                $found[$n] = Copy-DllIfFound (Join-Path $dir $n)
              }
            }
          }

          # Bundle the selected CUDA toolkit's versioned runtime DLLs without
          # hard-coding minor-version filenames.
          if ($env:CUDA_PATH) {
            $cudaBin = Join-Path $env:CUDA_PATH 'bin'
            if (Test-Path $cudaBin) {
              $wildcards = @(
                'cudart64_*.dll',
                'cublas64_*.dll',
                'cublasLt64_*.dll',
                'cusparse64_*.dll',
                'cusolver64_*.dll',
                'curand64_*.dll',
                'nvrtc64_*.dll',
                'nvrtc-builtins64_*.dll',
                'nvJitLink64_*.dll'
              )
              foreach ($wc in $wildcards) {
                $matches = Get-ChildItem -Path $cudaBin -Filter $wc -ErrorAction SilentlyContinue
                foreach ($m in $matches) {
                  Copy-Item -Force $m.FullName $packageDir
                  Write-Host "Bundled (wildcard): $($m.FullName)"
                }
              }
            }
          }

          $missing = @()
          foreach ($n in $requiredDlls) { if (-not $found[$n]) { $missing += $n } }
          if ($missing.Count -gt 0) {
            Write-Warning "Some runtime DLLs were not found and could not be bundled: $($missing -join ', ')"
          }

      - name: Validate llama.cpp exports
        shell: pwsh
        run: |
          $nvcuda = Join-Path $env:WINDIR 'System32\nvcuda.dll'
          if (Test-Path $nvcuda) {
            python scripts/validate_llama_exports.py
          } else {
            $llamaDll = Get-ChildItem src\llama_cpp_py_sync -Filter llama.dll | Select-Object -First 1
            if (-not $llamaDll) { throw 'llama.dll was not packaged' }
            $exports = dumpbin /exports $llamaDll.FullName | Out-String
            foreach ($symbol in @('llama_backend_init', 'llama_model_load_from_file')) {
              if ($exports -notmatch $symbol) { throw "Missing required export: $symbol" }
            }
            Write-Host 'Static CUDA wheel export validation passed (runner has no NVIDIA driver).'
          }

      - name: Self-sign LLaMA-owned Windows native artifacts (test-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/sign_windows_self_signed.ps1 `
            -Root 'src\llama_cpp_py_sync' `
            -CertificateOutput (Join-Path $env:RUNNER_TEMP 'llama-windows-x64-cuda-test.cer')

      - name: Upload Windows test certificate
        uses: actions/upload-artifact@v4
        with:
          name: certificate-windows-x64-cuda-test
          path: ${{ runner.temp }}/llama-windows-x64-cuda-test.cer
      
      - name: Generate version
        run: |
          python scripts/auto_version.py --update
      
      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Retag wheel (windows)
        shell: pwsh
        run: |
          python -m pip install --upgrade wheel
          $wheels = Get-ChildItem -Path dist -Filter *.whl
          if (-not $wheels) { throw "No wheels found in dist/" }
          foreach ($w in $wheels) {
            python -m wheel tags --platform-tag win_amd64 --build 1cu128 $w.FullName
          }
          foreach ($w in $wheels) { Remove-Item -Force $w.FullName }

      - name: Smoke test installed wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          $wheel = Get-ChildItem -Path dist -Filter *win_amd64.whl | Select-Object -First 1
          if (-not $wheel) { throw "No win_amd64 wheel found in dist/" }
          python -m pip install --force-reinstall $wheel.FullName
          if ($env:CUDA_PATH) {
            $cudaBin = Join-Path $env:CUDA_PATH 'bin'
            if (Test-Path $cudaBin) { $env:Path = "$cudaBin;$env:Path" }
          }
          $nvTools = 'C:\Program Files\NVIDIA Corporation\NvToolsExt\bin\x64'
          if (Test-Path $nvTools) { $env:Path = "$nvTools;$env:Path" }

          $nvcuda = Join-Path $env:WINDIR 'System32\nvcuda.dll'
          if (-not (Test-Path $nvcuda)) {
            Write-Warning "NVIDIA driver DLL not present on runner ($nvcuda). Skipping runtime CUDA load smoke test."
            python -c "import pathlib, llama_cpp_py_sync; pkg=pathlib.Path(llama_cpp_py_sync.__file__).parent; print('pkg_dir=', str(pkg)); print('bundled_dlls=', sorted([x.name for x in pkg.glob('*.dll')]))"
            $ggmlCuda = Join-Path ((python -c "import pathlib, llama_cpp_py_sync; print(pathlib.Path(llama_cpp_py_sync.__file__).parent.as_posix())").Trim()) 'ggml-cuda.dll'
            if (Test-Path $ggmlCuda) { dumpbin /dependents $ggmlCuda }
            exit 0
          }

          python -c "import os; import pathlib; p=os.environ.get('CUDA_PATH'); pkg = pathlib.Path(__import__('llama_cpp_py_sync').__file__).parent; print('pkg_dir=', str(pkg)); print('bundled_dlls=', sorted([x.name for x in pkg.glob('*.dll')])); \nif p: \n  cuda_bin=os.path.join(p,'bin'); \n  if os.path.isdir(cuda_bin): \n    os.add_dll_directory(cuda_bin); \n    print('added_dll_dir=', cuda_bin); \nif os.path.isdir(r'C:\\Program Files\\NVIDIA Corporation\\NvToolsExt\\bin\\x64'): \n  os.add_dll_directory(r'C:\\Program Files\\NVIDIA Corporation\\NvToolsExt\\bin\\x64'); \n  print('added_dll_dir= NvToolsExt'); \nfrom llama_cpp_py_sync._cffi_bindings import get_lib, get_mtmd_lib; get_lib(); get_mtmd_lib(); print('smoke-ok')"

      - name: Diagnose llama.dll dependencies (windows cuda)
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $pkgDir = python -c "import pathlib, llama_cpp_py_sync; print(pathlib.Path(llama_cpp_py_sync.__file__).parent.as_posix())"
          Write-Host "pkg_dir: $pkgDir"
          if (Test-Path $pkgDir) {
            Write-Host "DLLs in package dir:"
            Get-ChildItem -Path $pkgDir -Filter *.dll | Select-Object Name,Length | Format-Table -AutoSize
          }

          $llamaDll = Join-Path $pkgDir 'llama.dll'
          Write-Host "llama.dll path: $llamaDll"
          if (Test-Path $llamaDll) { dumpbin /dependents $llamaDll } else { Write-Warning "llama.dll not found" }

          $ggmlDll = Join-Path $pkgDir 'ggml.dll'
          Write-Host "ggml.dll path: $ggmlDll"
          if (Test-Path $ggmlDll) { dumpbin /dependents $ggmlDll } else { Write-Warning "ggml.dll not found" }

          $ggmlBaseDll = Join-Path $pkgDir 'ggml-base.dll'
          Write-Host "ggml-base.dll path: $ggmlBaseDll"
          if (Test-Path $ggmlBaseDll) { dumpbin /dependents $ggmlBaseDll } else { Write-Warning "ggml-base.dll not found" }

          $ggmlCpuDll = Join-Path $pkgDir 'ggml-cpu.dll'
          Write-Host "ggml-cpu.dll path: $ggmlCpuDll"
          if (Test-Path $ggmlCpuDll) { dumpbin /dependents $ggmlCpuDll } else { Write-Warning "ggml-cpu.dll not found" }

          $ggmlCudaDll = Join-Path $pkgDir 'ggml-cuda.dll'
          Write-Host "ggml-cuda.dll path: $ggmlCudaDll"
          if (Test-Path $ggmlCudaDll) { dumpbin /dependents $ggmlCudaDll } else { Write-Warning "ggml-cuda.dll not found" }
      
      - name: Attest final wheel
        uses: actions/attest@v4
        with:
          subject-path: dist/*win_amd64.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x64-cuda-cu128
          path: dist/*win_amd64.whl

  build-windows-x64-vulkan:
    needs: [check-upstream, validate-bindings]
    if: needs.check-upstream.outputs.should_build == 'true' && (needs.check-upstream.outputs.build_target == 'all' || needs.check-upstream.outputs.build_target == 'windows-x64-vulkan')
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: '1.4.335.0'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel cffi numpy
      
      - name: Clone llama.cpp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LLAMA_SHA = '${{ needs.check-upstream.outputs.upstream_sha }}'
          git clone ${{ env.LLAMA_CPP_REPO }} vendor/llama.cpp
          git -C vendor/llama.cpp fetch --depth 1 origin $env:LLAMA_SHA
          git -C vendor/llama.cpp checkout --detach $env:LLAMA_SHA

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y

      - name: Regenerate bindings from vendored llama.cpp
        shell: pwsh
        run: |
          $sha = git -C vendor/llama.cpp rev-parse HEAD
          python scripts/gen_bindings.py --commit-sha $sha
      
      - name: Build llama.cpp with Vulkan
        run: |
          python scripts/build_llama_cpp.py --no-cuda --no-rocm --no-metal

      - name: Validate llama.cpp exports
        run: |
          python scripts/validate_llama_exports.py

      - name: Bundle Windows runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'src\llama_cpp_py_sync'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $requiredDlls = @(
            # MSVC runtime (OpenMP might not be used for Vulkan builds but bundling is harmless)
            'vcruntime140.dll',
            'vcruntime140_1.dll',
            'msvcp140.dll',
            'concrt140.dll',
            'vcomp140.dll',
            # Vulkan loader
            'vulkan-1.dll'
          )

          function Copy-DllIfFound([string]$path) {
            if (Test-Path $path) {
              Copy-Item -Force $path $packageDir
              Write-Host "Bundled: $path"
              return $true
            }
            return $false
          }

          $searchDirs = @()

          if ($env:VCToolsRedistDir) {
            $searchDirs += (Join-Path $env:VCToolsRedistDir 'x64\Microsoft.VC143.CRT')
            $searchDirs += (Join-Path $env:VCToolsRedistDir 'x64')
          }

          $pf86 = ${env:ProgramFiles(x86)}
          if (-not $pf86) { $pf86 = 'C:\\Program Files (x86)' }
          $vsRoot = Join-Path $pf86 'Microsoft Visual Studio'
          if (Test-Path $vsRoot) {
            $candidates = Get-ChildItem -Path $vsRoot -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\VC\\Redist\\MSVC\\' -and $_.FullName -match '\\x64(\\Microsoft\.VC\d+\.CRT)?$' }
            foreach ($dir in $candidates) {
              $searchDirs += $dir.FullName
            }
          }

          $searchDirs += (Join-Path $env:WINDIR 'System32')
          $searchDirs += (Join-Path $env:WINDIR 'SysWOW64')

          if ($env:VULKAN_SDK -and (Test-Path $env:VULKAN_SDK)) {
            $searchDirs += (Join-Path $env:VULKAN_SDK 'Bin')
            $searchDirs += (Join-Path $env:VULKAN_SDK 'Lib')
          }
          $searchDirs += 'C:\\VulkanSDK\\1.4.335.0\\Bin'
          $searchDirs += 'C:\\VulkanSDK\\1.4.335.0\\Lib'

          $searchDirs = $searchDirs | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          $found = @{}
          foreach ($n in $requiredDlls) { $found[$n] = $false }

          foreach ($n in $requiredDlls) {
            foreach ($dir in $searchDirs) {
              if (-not $found[$n]) {
                $found[$n] = Copy-DllIfFound (Join-Path $dir $n)
              }
            }
          }

          $missing = @()
          foreach ($n in $requiredDlls) { if (-not $found[$n]) { $missing += $n } }
          if ($missing.Count -gt 0) {
            Write-Warning "Some runtime DLLs were not found and could not be bundled: $($missing -join ', ')"
          }

      - name: Self-sign LLaMA-owned Windows native artifacts (test-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/sign_windows_self_signed.ps1 `
            -Root 'src\llama_cpp_py_sync' `
            -CertificateOutput (Join-Path $env:RUNNER_TEMP 'llama-windows-x64-vulkan-test.cer')

      - name: Upload Windows test certificate
        uses: actions/upload-artifact@v4
        with:
          name: certificate-windows-x64-vulkan-test
          path: ${{ runner.temp }}/llama-windows-x64-vulkan-test.cer
      
      - name: Generate version
        run: |
          python scripts/auto_version.py --update
      
      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Retag wheel (windows)
        shell: pwsh
        run: |
          python -m pip install --upgrade wheel
          $wheels = Get-ChildItem -Path dist -Filter *.whl
          if (-not $wheels) { throw "No wheels found in dist/" }
          foreach ($w in $wheels) {
            python -m wheel tags --platform-tag win_amd64 --build 1vulkan $w.FullName
          }
          foreach ($w in $wheels) { Remove-Item -Force $w.FullName }

      - name: Smoke test installed wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          $wheel = Get-ChildItem -Path dist -Filter *win_amd64.whl | Select-Object -First 1
          if (-not $wheel) { throw "No win_amd64 wheel found in dist/" }
          python -m pip install --force-reinstall $wheel.FullName
          python -c "from llama_cpp_py_sync._cffi_bindings import get_lib, get_mtmd_lib; get_lib(); get_mtmd_lib(); print('smoke-ok')"
          python -c "from llama_cpp_py_sync.backends import get_backend_info; info=get_backend_info(); assert info.vulkan, info; print('vulkan-backend-ok')"
      
      - name: Attest final wheel
        uses: actions/attest@v4
        with:
          subject-path: dist/*win_amd64.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x64-vulkan
          path: dist/*win_amd64.whl

  release:
    needs: [check-upstream, build-linux-x86_64, build-linux-x86_64-cuda, build-linux-x86_64-vulkan, build-macos-arm64, build-macos-arm64-vulkan, build-macos-x86_64, build-macos-x86_64-vulkan, build-windows-x64, build-windows-x64-cuda, build-windows-x64-vulkan]
    if: always() && !failure() && !cancelled() && needs.check-upstream.result == 'success' && needs.check-upstream.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: needs.check-upstream.outputs.upstream_tag_exists == 'true'
        with:
          tag_name: ${{ needs.check-upstream.outputs.release_tag }}
          # Publish installable wheels only, excluding signing sidecar files.
          files: dist/*.whl
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: true
          make_latest: false
          body: |
            **Upstream llama.cpp:**
            - Release page: https://github.com/ggml-org/llama.cpp/releases/tag/${{ needs.check-upstream.outputs.upstream_tag }}
            - Tag page: https://github.com/ggml-org/llama.cpp/tree/${{ needs.check-upstream.outputs.upstream_tag }}
          generate_release_notes: true
      
      # Distribution is GitHub-only; candidates stay in drafts for local signing.

  attest-signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download selected draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.signed_release_id }}
        run: python scripts/release_asset_download.py metadata
      - name: Authenticate local signing manifest
        id: authenticated
        env:
          RELEASE_ID: ${{ inputs.signed_release_id }}
          SIGNING_SESSION: ${{ inputs.signing_session }}
          MANIFEST_SHA256: ${{ inputs.signing_manifest_sha256 }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path("signed-release")
          manifest = root / "release-signing.json"
          signature = json.loads((root / "release-signing.sig.json").read_text())
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == os.environ["MANIFEST_SHA256"]
          key = pathlib.Path("scripts/release-signing-public.pem")
          der = subprocess.check_output(["openssl", "pkey", "-pubin", "-in", str(key), "-outform", "DER"])
          expected = "37308863a4298862c06004abc7ecf968cc6cba5a55ef36abea57a785864f1dee"
          assert hashlib.sha256(der).hexdigest() == expected == signature["spki_sha256"]
          assert signature["algorithm"] == "RSASSA_PKCS1_V1_5_SHA_256"
          assert base64.b64decode(signature["digest_base64"], validate=True) == hashlib.sha256(manifest.read_bytes()).digest()
          detached = pathlib.Path("manifest-signature.bin")
          detached.write_bytes(base64.b64decode(signature["signature_base64"], validate=True))
          subprocess.run(["openssl", "dgst", "-sha256", "-verify", str(key), "-signature", str(detached), str(manifest)], check=True)
          data = json.loads(manifest.read_text())
          assert data["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert data["release_id"] == int(os.environ["RELEASE_ID"])
          assert data["session"] == os.environ["SIGNING_SESSION"]
          assert re.fullmatch(r"[0-9a-f]{40}", data["signer_revision"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("revision=" + data["signer_revision"] + "\n")
      - name: Download only manifest-authorized final files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.signed_release_id }}
        run: python scripts/release_asset_download.py files
      - name: Verify every final release file
        env:
          RELEASE_ID: ${{ inputs.signed_release_id }}
          SIGNING_SESSION: ${{ inputs.signing_session }}
        shell: python
        run: |
          import pathlib, json, os, re, hashlib
          Path = pathlib.Path
          Refused = RuntimeError
          REPOSITORIES = {'llama': 'fael-ai-org/llama-cpp-py-sync', 'python': 'fael-ai-org/python-builds'}
          def safe_name(value: str) -> str:
              if (not isinstance(value, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,219}", value)
                      or value in {".", ".."} or value.endswith(".")):
                  raise Refused("Invalid release asset name")
              return value

          def digest(path: Path) -> str:
              result = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      result.update(chunk)
              return result.hexdigest()

          def verify_files(root: Path, manifest: dict, repository: str, release_id: int, session: str):
              if (repository not in REPOSITORIES.values() or manifest.get("repository") != repository
                      or manifest.get("release_id") != release_id or manifest.get("session") != session
                      or not re.fullmatch(r"[0-9a-f]{40}", manifest.get("signer_revision", ""))):
                  raise Refused("Release manifest is for a different release or coordinator revision")
              expected = {safe_name(item["name"]): item for item in manifest["files"]}
              if len(expected) != len(manifest["files"]):
                  raise Refused("Release manifest contains duplicate output names")
              actual = {path.name for path in root.iterdir() if path.is_file()}
              if actual != set(expected) | {"release-signing.json", "release-signing.sig.json"}:
                  raise Refused("Release contains unlisted, missing or partially replaced files")
              for name, item in expected.items():
                  path = root / name
                  if path.is_symlink() or digest(path) != item["sha256"] or path.stat().st_size != item["size"]:
                      raise Refused("Final release file differs from its signed manifest")
              return expected

          verify_files(pathlib.Path('signed-release'), json.loads(pathlib.Path('signed-release/release-signing.json').read_text()), os.environ['GITHUB_REPOSITORY'], int(os.environ['RELEASE_ID']), os.environ['SIGNING_SESSION'])

      - name: Attest locally signed release files
        uses: actions/attest@v4
        with:
          subject-path: signed-release/*
